# Configuration for Text Classification Fine-tuning
model:
  name: "bert-base-uncased"
  type: "classification"
  num_labels: 2
  load_in_8bit: false
  load_in_4bit: false

training:
  output_dir: "./output/classification-model"
  num_epochs: 5
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  warmup_steps: 500
  max_steps: -1
  logging_steps: 50
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  fp16: false
  bf16: false

data:
  dataset_name: null
  train_file: "examples/classification_data.json"
  validation_file: null
  test_file: null
  max_seq_length: 256
  text_column: "text"
  label_column: "label"

lora:
  use_lora: false
  r: 8
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules: ["query", "value"]
  bias: "none"
  task_type: "SEQ_CLS"

logging:
  use_wandb: false
  wandb_project: "classification-finetuning"
  wandb_run_name: null
  use_tensorboard: true
  log_dir: "./logs/classification"

optimizer:
  name: "adamw"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

scheduler:
  name: "linear"
  num_warmup_steps: 500

seed: 42
